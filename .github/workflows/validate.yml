name: Validate Academy source
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "site/**"
      - "courses/**"
      - ".github/workflows/validate.yml"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Catalog validation
        run: python scripts/validate_catalog.py --output validation-report.json
      - name: Academy unit tests
        run: python -m unittest discover -s tests -v
      - name: Build website
        run: python scripts/build.py
      - name: Check generated pages
        run: |
          test -s site/index.html
          test -s site/courses.json
          test -s site/learn/ai-agents-101/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: academy-validation
          path: validation-report.json
          if-no-files-found: ignore
